network:
  host: 127.0.0.1
  port: 8091
  disable_auth: true
  api_servers: [OAI]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: /mnt/extended/gisenberg/models
  model_name: deepseek-v4-flash-0731-exl3-2.04bpw-b5526bab
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  cache_mode: FP16
  chunk_size: 2048
  output_chunking: true
  max_batch_size: 1
  cpu_moe_offload_layers: 0
  reasoning: true
  reasoning_start_token: <think>
  reasoning_end_token: </think>
  start_in_reasoning: auto
  tool_calls_in_reasoning: true
  tool_format: deepseek_v4

draft_model:
  draft_mode: mtp
  draft_num_tokens: 7

sampling:
  override_preset:

memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 0
  cuda_malloc_async: true
